<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090a0f">
    <title>Extreme Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="./script.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>WEATHER</h1>
        </header>
        
        <main>
            <div class="search-section">
                <input type="text" id="city" oninput="handleInput()" placeholder="Search a city..." autocomplete="off">
                <div id="search-container"></div>
            </div>
            
            <div class="weather-display">
                <h2 id="weather-title"></h2>
                <div id="days-container"></div>
                <div class="table-wrapper">
                    <div id="weather-container"></div>
                </div>
            </div>
        </main>
        
        <footer>DATA PROVIDED BY ©OPEN-METEO</footer>
    </div>
</body>
</html>
